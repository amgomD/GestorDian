<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoreo — Procesador Facturación DIAN</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <!-- Tabs móvil: Empresas / Detalle (solo visibles en pantallas pequeñas) -->
  <div class="tabs-movil">
    <button id="tab-mov-empresas" class="activa">Empresas</button>
    <button id="tab-mov-detalle">Detalle</button>
  </div>

  <div class="layout">

    <aside id="sidebar">
      <div class="sidebar-marca">
        <h2>Empresas</h2>
        <p class="sidebar-sub">Procesador de facturación DIAN</p>
      </div>
      <div id="lista-empresas"><!-- generado por panel.js --></div>
    </aside>

    <main id="panel-central">

      <div id="sin-seleccion" class="mensaje-vacio">
        Selecciona una empresa de la izquierda para buscar y enviar facturas.
      </div>

      <div id="contenido-empresa" class="oculto">

        <div class="encabezado-empresa">
          <div>
            <p class="encabezado-sobre">Empresa</p>
            <h2 id="titulo-empresa">-</h2>
          </div>
          <button id="btn-consultar-radian" class="btn btn-suave">Consultar Radian</button>
        </div>

        <div class="tabs">
          <button class="tab-btn activa" data-tab="facturas">Facturas</button>
          <button class="tab-btn" data-tab="correo">Correo</button>
        </div>

        <!-- TAB FACTURAS -->
        <section id="tab-facturas" class="tab-contenido activa">

          <form id="form-filtros" class="filtros tarjeta">
            <label>Desde <input type="date" id="filtro-desde" /></label>
            <label>Hasta <input type="date" id="filtro-hasta" /></label>
            <label>Número <input type="text" id="filtro-numero" placeholder="Número de documento" /></label>
            <label>Cliente <input type="text" id="filtro-cliente" placeholder="Cliente" /></label>
            <button type="submit" class="btn btn-primario">Buscar</button>
          </form>

          <div id="resultado-info"></div>

          <div class="acciones-lote">
            <button id="btn-enviar-seleccion" class="btn btn-suave" disabled>Enviar seleccionadas</button>
            <button id="btn-enviar-todas" class="btn btn-peligro" disabled>Enviar todas</button>
          </div>

          <div class="tarjeta tarjeta-tabla">
            <table id="tabla-facturas">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="check-todas" /></th>
                  <th>Documento</th>
                  <th>Fecha</th>
                  <th class="col-num">Total</th>
                  <th>Estado</th>
                  <th class="col-accion"></th>
                </tr>
              </thead>
              <tbody id="cuerpo-facturas"></tbody>
            </table>
          </div>

        </section>

        <!-- TAB CORREO -->
        <section id="tab-correo" class="tab-contenido">

          <div class="acciones-lote acciones-lote-secuencia">
            <button id="btn-cargar-correos" class="btn btn-primario">Cargar facturas sin correo</button>
            <button id="btn-enviar-correo-seleccion" class="btn btn-suave" disabled>Enviar seleccionados</button>
            <button id="btn-enviar-correo-todos" class="btn btn-peligro" disabled>Enviar todos</button>
          </div>

          <div id="resultado-info-correo"></div>

          <div class="tarjeta tarjeta-tabla">
            <table id="tabla-correos">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="check-todas-correo" /></th>
                  <th>Documento</th>
                  <th>Correo</th>
                  <th>Fecha</th>
                  <th class="col-num">Intentos</th>
                  <th>Estado</th>
                  <th class="col-accion"></th>
                </tr>
              </thead>
              <tbody id="cuerpo-correos"></tbody>
            </table>
          </div>

        </section>

      </div>

      <!-- MODAL para respuesta de Radian -->
      <div id="modal-radian" class="modal-overlay oculto">
        <div class="modal-caja">
          <div class="modal-encabezado">
            <span>Respuesta de Radian</span>
            <button id="cerrar-modal-radian">✕</button>
          </div>
          <pre id="modal-radian-contenido"></pre>
        </div>
      </div>

    </main>
  </div>

  <script src="panel.js"></script>
</body>
</html>
